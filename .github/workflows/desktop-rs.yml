name: Desktop RS CI

on:
  push:
    branches: [ main ]
    tags: [ 'desktop-rs-v*' ]
    paths:
      - 'desktop-rs/**'
      - '.github/workflows/desktop-rs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb:
    # Pinned to Ubuntu 24.04 (glibc 2.39): ubuntu-latest drifted to a
    # glibc 2.43 floor, which made the .deb uninstallable on 24.04 —
    # the version baseline is a product decision, not a default.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native link dependencies
        # winit (vendored, for Rune) links libxkbcommon; the runner image
        # does not ship its headers. Local dev machines usually have it,
        # which is why this only shows up in CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs

      - name: Unit tests
        # First test suite for the desktop port (Wave 2 of the
        # improvement program): meta/catalog/core/store logic ported
        # from the Android JVM cases. Network-free by construction.
        run: cargo test --locked

      - name: Build release (LTO, stripped)
        run: cargo build --release --locked

      - name: Read version (single source: Cargo.toml)
        id: ver
        run: |
          V=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Package .deb
        run: |
          ./packaging/package-deb.sh target/release/lanfetch-rs "$GITHUB_WORKSPACE/lanfetch-rs_${{ steps.ver.outputs.version }}_amd64.deb"
          dpkg-deb -I "$GITHUB_WORKSPACE/lanfetch-rs_${{ steps.ver.outputs.version }}_amd64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lanfetch-rs-deb
          path: lanfetch-rs_${{ steps.ver.outputs.version }}_amd64.deb
          if-no-files-found: error
          retention-days: 14

  release:
    # Tagging desktop-rs-vX.Y.Z publishes the .deb as a GitHub release —
    # the exact artifact the in-app update checker looks for.
    if: startsWith(github.ref, 'refs/tags/desktop-rs-v')
    needs: deb
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfetch-rs-deb

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LanFetch Desktop $GITHUB_REF_NAME" \
            --notes "LanFetch desktop (Rust + Rune) — Linux .deb. Install: sudo apt install ./lanfetch-rs_*_amd64.deb" \
            lanfetch-rs_*_amd64.deb
