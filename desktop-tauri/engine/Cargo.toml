[package]
name = "lanfetch-engine"
version = "1.6.0"
edition = "2021"
license = "MIT"
description = "LanFetch engine — LAN catalog browsing + segmented resumable downloads, shared by the desktop app and the web binary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
regex = "1"
