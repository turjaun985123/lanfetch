name: Desktop RS CI

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop-rs/**'
      - '.github/workflows/desktop-rs.yml'
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install native link dependencies
        # winit (vendored, for Rune) links libxkbcommon; the runner image
        # does not ship its headers. Local dev machines usually have it,
        # which is why this only shows up in CI.
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs

      - name: Build release (LTO, stripped)
        run: cargo build --release --locked

      - name: Render UI snapshot (headless)
        # Every Rune app can render its first frame to a PNG with --snap;
        # this is the desktop UI's visual check, uploaded as an artifact.
        # The runner has no display, so provide a virtual one via Xvfb
        # (winit refuses to start without WAYLAND_DISPLAY or DISPLAY).
        continue-on-error: true
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libxkbcommon-x11-0
          xvfb-run -a ./target/release/lanfetch-rs --snap "$GITHUB_WORKSPACE/lanfetch-ui.png"

      - name: Upload UI snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lanfetch-rs-ui
          path: lanfetch-ui.png
          if-no-files-found: ignore

      - name: Package .deb
        run: |
          ./packaging/package-deb.sh target/release/lanfetch-rs "$GITHUB_WORKSPACE/lanfetch-rs_1.1.0_amd64.deb"
          dpkg-deb -I "$GITHUB_WORKSPACE/lanfetch-rs_1.1.0_amd64.deb"

      - name: Upload .deb
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lanfetch-rs-deb
          path: lanfetch-rs_1.1.0_amd64.deb
