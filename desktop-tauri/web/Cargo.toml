[package]
name = "lanfetch-web"
version = "2.0.0"
edition = "2021"
license = "MIT"
description = "LanFetch Web — the single-binary web edition: engine + embedded UI, no GUI dependencies"

[[bin]]
name = "lanfetch-web"
path = "src/main.rs"

[dependencies]
lanfetch-engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
include_dir = "0.7"
