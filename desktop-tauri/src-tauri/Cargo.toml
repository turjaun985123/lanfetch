[package]
name = "lanfetch-tauri"
version = "1.6.0"
edition = "2021"
license = "MIT"
description = "LanFetch Desktop — browse LAN file servers and download with a segmented, resumable engine (Rust + Tauri)"

[lib]
name = "lanfetch_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lanfetch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
