name: Desktop Tauri CI

on:
  push:
    branches: [ main ]
    tags: [ 'desktop-tauri-v*' ]
    paths:
      - 'desktop-tauri/**'
      - '.github/workflows/desktop-tauri.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Pinned to Ubuntu 24.04 (glibc 2.39) — same baseline decision as
    # the retired desktop-rs workflow: a newer glibc floor would make
    # the .deb uninstallable on the user's Ubuntu 24.04 machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Version consistency (package.json == Cargo.toml)
        run: |
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$PKG src-tauri/Cargo.toml=$CARGO"
          test "$PKG" = "$CARGO"

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build frontend (Astro)
        run: npm run build

      # Static tripwires only (redesign Agents 15/27): they prove
      # the responsive rules survived compilation into dist — NOT
      # that anything renders correctly. Layout truth is the human
      # RESPONSIVE-QA.md pass on the release candidate.
      - name: Responsive guardrails (static — not layout tests)
        run: |
          CSS=$(ls dist/_astro/*.css)
          for b in 'max-width: ?639px' 'min-width: ?640px' 'min-width: ?768px' 'min-width: ?1280px' 'min-width: ?1536px' 'min-width: ?1920px'; do
            grep -qE "@media[^{]*$b" $CSS || { echo "missing media band: $b"; exit 1; }
          done
          grep -qE 'env\(safe-area-inset-(bottom|top)' $CSS || { echo "no safe-area inset in dist CSS"; exit 1; }
          grep -hoE '(^|[;{])width: ?[0-9]+px' $CSS | grep -oE '[0-9]+' | \
            awk '$1>240 {print "oversize fixed width: "$1"px"; bad=1} END {exit bad}'
          ! grep -rnE 'w-\[(3[0-9]{2}|[4-9][0-9]{2}|[0-9]{4,})px\]' src/ || { echo "w-[>=300px] in src"; exit 1; }

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Tauri system dependencies
        # WebKitGTK stack Tauri links against on Linux. Also needed for
        # `cargo test`: compiling the tauri crate runs webkit2gtk-sys.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            build-essential pkg-config file

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri

      - name: Placeholder frontend dist (for cargo test only)
        # generate_context! embeds frontendDist at compile time; the
        # real Astro build runs in the frontend/bundle jobs. The test
        # job only needs the path to exist.
        working-directory: desktop-tauri
        run: |
          mkdir -p dist
          printf '<!doctype html><title>LanFetch</title>' > dist/index.html

      - name: Format check
        run: cargo fmt --check --all

      - name: Clippy (gate — promoted in Wave 2 after the carried code's 8 findings were fixed)
        run: cargo clippy --locked --workspace -- -D warnings

      - name: Unit tests
        # The engine suite (47 tests from core/catalog/meta/store/
        # manager) must pass unmodified in its new home — now the
        # engine crate, shared by the desktop app and the web binary.
        run: cargo test --locked --workspace

  bundle:
    needs: [frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            build-essential pkg-config file

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build frontend (Astro)
        # Its own step with its own verdict; the Tauri build below runs
        # with beforeBuildCommand disabled so it never rebuilds this.
        run: npm run build

      - name: Build Tauri app (no bundle)
        # Tauri's own deb bundler derives Package from productName
        # ("LanFetch"), breaking the dpkg upgrade path from the
        # Rune-era "lanfetch" package — packaging is done by the
        # project's proven script instead (Release plan's documented
        # fallback, adopted in Wave 2 after the bundler's .deb failed
        # the identity assert).
        run: npx tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'

      - name: Package .deb (project script)
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          sh packaging/package-deb.sh target/release/lanfetch "lanfetch_${VERSION}_amd64.deb"

      - name: Assert .deb identity (Package + Version gate the upgrade path)
        run: |
          DEB=$(ls lanfetch_*_amd64.deb | head -1)
          echo "Built: $DEB"
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          dpkg-deb -f "$DEB" Package | grep -qx lanfetch
          dpkg-deb -f "$DEB" Version | grep -qx "$VERSION"
          dpkg-deb -I "$DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanfetch-deb
          path: desktop-tauri/lanfetch_*_amd64.deb
          if-no-files-found: error
          retention-days: 14

      - name: Build web binary (single binary, embedded UI, no GUI deps)
        run: |
          cargo build --release -p lanfetch-web --locked
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          cp target/release/lanfetch-web "lanfetch-web-${VERSION}-linux-x86_64"
          file "lanfetch-web-${VERSION}-linux-x86_64"
          # The web edition's defining property: it must not link
          # any GUI stack — it runs headless, anywhere.
          if ldd target/release/lanfetch-web | grep -qiE 'webkit|libgtk'; then
            echo "lanfetch-web links GUI libraries — it must not"; exit 1
          fi
          echo "lanfetch-web links no GUI libraries ✓"

      - name: Upload web binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanfetch-web
          path: desktop-tauri/lanfetch-web-*
          if-no-files-found: error
          retention-days: 14

  web-arm64:
    # The web binary for ARM64 machines (Raspberry Pi, ARM VPS,
    # ARM mini-PCs): built natively on GitHub's ARM runner — no
    # cross toolchain, and the ldd assertion below runs against
    # the real architecture.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build frontend (Astro)
        run: npm run build

      - name: Build web binary (arm64, single binary, embedded UI, no GUI deps)
        run: |
          cargo build --release -p lanfetch-web --locked
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          cp target/release/lanfetch-web "lanfetch-web-${VERSION}-linux-arm64"
          file "lanfetch-web-${VERSION}-linux-arm64"
          if ldd target/release/lanfetch-web | grep -qiE 'webkit|libgtk'; then
            echo "lanfetch-web links GUI libraries — it must not"; exit 1
          fi
          echo "lanfetch-web (arm64) links no GUI libraries ✓"

      - name: Upload web binary (arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanfetch-web-arm64
          path: desktop-tauri/lanfetch-web-*-linux-arm64
          if-no-files-found: error
          retention-days: 14

  web-android-arm64:
    # The web binary for Android itself (arm64), built with the
    # Android NDK: run it under Termux on an Android phone/tablet
    # and the phone becomes the LanFetch server — browse and
    # download from the phone's own browser, files landing in
    # ~/Downloads/LanFetch under Termux's HOME.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node (pinned)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: Install Rust (pinned) + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: aarch64-linux-android

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Build frontend (Astro)
        run: npm run build

      - name: Build web binary (Android arm64, via the NDK)
        run: |
          NDK_BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK clang: $NDK_BIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo build --release -p lanfetch-web --target aarch64-linux-android --locked
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          cp target/aarch64-linux-android/release/lanfetch-web "lanfetch-web-${VERSION}-android-arm64"
          file "lanfetch-web-${VERSION}-android-arm64"

      - name: Upload web binary (Android arm64) artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanfetch-web-android-arm64
          path: desktop-tauri/lanfetch-web-*-android-arm64
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-tauri-v')
    needs: [bundle, web-arm64, web-android-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfetch-deb
          path: deb

      - name: Download web binary artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfetch-web
          path: deb

      - name: Download web binary (arm64) artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfetch-web-arm64
          path: deb

      - name: Download web binary (Android arm64) artifact
        uses: actions/download-artifact@v4
        with:
          name: lanfetch-web-android-arm64
          path: deb

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: turjaun985123/lanfetch
        run: |
          DEB=$(ls deb/*.deb | head -1)
          WEB=$(ls deb/lanfetch-web-*-linux-x86_64 | head -1)
          WEBARM=$(ls deb/lanfetch-web-*-linux-arm64 | head -1)
          WEBAND=$(ls deb/lanfetch-web-*-android-arm64 | head -1)
          chmod +x "$WEB" "$WEBARM" "$WEBAND"
          ARGS=(--title "LanFetch $GITHUB_REF_NAME" --notes "LanFetch 1.6.0 — two editions. DESKTOP: install the .deb (Tauri app). WEB: download the lanfetch-web-* file for your CPU (linux-x86_64 linux-arm64, or android-arm64 to run under Termux on an Android device), chmod +x it, run it (add --lan to reach it from another device) and open the printed address — a single binary with the UI embedded, no GUI libraries needed. See desktop-tauri/CHANGELOG.md for details. Rune builds (1.5.0 and earlier) do not auto-update to this release — install this .deb once manually; upgrades are automatic again after that.")
          case "$GITHUB_REF_NAME" in
            *-rc*) ARGS+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$DEB" "$WEB" "$WEBARM" "$WEBAND" "${ARGS[@]}"
