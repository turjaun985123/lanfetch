[package]
name = "lanfetch-rs"
version = "1.1.0"
edition = "2021"
license = "MIT"
description = "LanFetch Desktop (Rust + Rune) — browse LAN file servers and download with a segmented, resumable engine"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "f4ec14ed32256ae0c36e73476825f9245437de5b", default-features = true }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Version pin only (no features): Rune's vendored wgpu-hal/naga patches are
# 30.0.1 and apply only at exactly that version; an unpinned resolve drifts
# to 30.0.2, the patches go unused, and cargo warns. This also keeps the
# graphics stack on the exact version Rune itself is tested against.
wgpu = { version = "=30.0.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Rune's vendored parley_engine (as published + UAX #9 / line-dictionary
# patches): rune-text's Windows target requires its `line-dictionaries`
# feature, which crates.io's parley_engine does not have, so the whole
# dependency graph fails to resolve without this patch. Same remedy Rune's
# own docs prescribe for apps that build Rune.
[patch.crates-io]
parley_engine = { path = "vendor/parley_engine" }
winit = { path = "vendor/winit" }
sctk-adwaita = { path = "vendor/sctk-adwaita" }
wgpu-hal = { path = "vendor/wgpu-hal" }
naga = { path = "vendor/naga" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
